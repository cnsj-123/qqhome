name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download Gradle
        run: curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o gradle.zip && unzip -q gradle.zip
      - name: Build debug APK
        run: ./gradle-8.10.2/bin/gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: closie-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

